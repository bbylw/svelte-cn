<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Svelte - 用于构建 Web 用户界面的编译器框架" />
		<meta name="color-scheme" content="light dark" />
		<script>
			try {
				// 'light dark' = 跟随系统；light / dark = 用户显式覆盖（兼容旧版的 theme 键）
				const stored = localStorage.getItem('color-scheme') || localStorage.getItem('theme');
				if (stored === 'light' || stored === 'dark') {
					document.querySelector('meta[name="color-scheme"]').content = stored;
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
